<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Character Dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe5;
    --paper-dark: #e8e0cf;
    --ink: #1f1d1a;
    --ink-soft: #4a463f;
    --ink-faint: #7a7468;
    --accent: #6b8caf;
    --accent-deep: #3d5a7a;
    --gold: #a88a4a;
    --gold-deep: #7e6432;
    --crimson: #8b3a3a;
    --rule: #c9bfa8;
    --rule-soft: #d8d0bd;
    --st-active: #5a7a52;
    --st-hiatus: #a88a4a;
    --st-past: #8a8478;
    --st-one-shot: #6b8caf;
    --st-unplayed: #9a6a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
    font-size: 16px;
    line-height: 1.6;
    font-weight: 400;
  }
  body {
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(168, 138, 74, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(107, 140, 175, 0.05) 0%, transparent 50%);
    min-height: 100vh;
    padding: 2.5rem 1rem 4rem;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  header.masthead {
    text-align: center;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1.75rem;
    margin-bottom: 2.25rem;
    position: relative;
  }
  header.masthead::before {
    content: "";
    position: absolute;
    top: -1.25rem; left: 50%; transform: translateX(-50%);
    width: 220px; height: 3px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--accent-deep) 20%,
      var(--gold) 50%,
      var(--accent-deep) 80%,
      transparent 100%);
  }
  header.masthead::after {
    content: "";
    display: block;
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 1rem auto 0;
  }
  .eyebrow {
    font-family: "Cormorant SC", serif;
    font-size: 0.78rem;
    letter-spacing: 0.4em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  h1.masthead-title {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 3rem;
    line-height: 1.05;
    margin: 0 0 0.4rem;
    letter-spacing: 0.02em;
  }
  .masthead-sub {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 1.05rem;
    margin: 0;
  }

  /* SEARCH + SORT BAR */
  .filters {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.25rem 1.5rem;
    align-items: end;
    max-width: 760px;
    margin: 0 auto 1.5rem;
    padding: 1.25rem 1.5rem;
    background: rgba(232, 224, 207, 0.45);
    border: 1px solid var(--rule);
    border-radius: 2px;
    position: relative;
  }
  .filters::before {
    content: "";
    position: absolute;
    top: -1px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%, var(--gold) 50%, transparent 100%);
  }
  .filter {
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .filter label {
    font-family: "Cormorant SC", serif;
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }
  .filter-input-wrap {
    position: relative;
  }
  .filter input {
    width: 100%;
    font-family: "EB Garamond", serif;
    font-size: 1.05rem;
    padding: 0.55rem 2.2rem 0.55rem 0.75rem;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .filter input:focus {
    border-color: var(--accent-deep);
  }
  .filter .clear-btn {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.15rem 0.4rem;
    line-height: 1;
    visibility: hidden;
    font-family: "EB Garamond", serif;
  }
  .filter .clear-btn.visible {
    visibility: visible;
  }
  .filter .clear-btn:hover { color: var(--crimson); }
  .sort-wrap {
    display: flex;
    flex-direction: column;
  }
  .sort-wrap label {
    font-family: "Cormorant SC", serif;
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }
  .sort-wrap select {
    font-family: "EB Garamond", serif;
    font-size: 1.05rem;
    padding: 0.55rem 0.6rem;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }
  .sort-wrap select:focus { border-color: var(--accent-deep); }

  .suggestions {
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-top: 1px solid var(--accent-deep);
    box-shadow: 0 4px 14px rgba(31, 29, 26, 0.12);
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .suggestions.open { display: block; }
  .sugg-group {
    font-family: "Cormorant SC", serif;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-deep);
    padding: 0.45rem 0.8rem 0.2rem;
    border-bottom: 1px solid var(--rule-soft);
    background: var(--paper-dark);
    position: sticky;
    top: 0;
  }
  .suggestion {
    padding: 0.5rem 0.8rem;
    cursor: pointer;
    font-size: 1rem;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--rule-soft);
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover,
  .suggestion.active {
    background: var(--paper-dark);
    color: var(--ink);
  }
  .suggestion .match {
    color: var(--accent-deep);
    font-weight: 500;
  }
  .suggestion.empty {
    color: var(--ink-faint);
    font-style: italic;
    cursor: default;
  }
  .suggestion.empty:hover { background: transparent; color: var(--ink-faint); }

  /* VIEW TOGGLES */
  .view-toggles {
    max-width: 760px;
    margin: 0 auto 1.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.75rem;
    align-items: baseline;
  }
  .toggle-group {
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .toggle-group-label {
    font-family: "Cormorant SC", serif;
    font-size: 0.68rem;
    letter-spacing: 0.32em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-right: 0.15rem;
    white-space: nowrap;
  }
  .toggle {
    font-family: "EB Garamond", serif;
    font-size: 0.92rem;
    padding: 0.22rem 0.65rem;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    letter-spacing: 0.01em;
    line-height: 1.4;
  }
  .toggle:hover { border-color: var(--accent-deep); color: var(--ink); }
  .toggle.on {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .toggle .count {
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin-left: 0.3rem;
  }
  .toggle.on .count { color: var(--rule); }
  .preset-select {
    font-family: "EB Garamond", serif;
    font-size: 0.92rem;
    padding: 0.22rem 0.7rem 0.22rem 0.65rem;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    line-height: 1.4;
    appearance: auto;
  }
  .preset-select:hover, .preset-select:focus {
    border-color: var(--accent-deep);
    color: var(--ink);
    outline: none;
  }
  .preset-select.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  /* CARD FOOTER */
  .card-footer {
    display: flex;
    align-items: center;
    padding: 0 1.1rem 0.65rem;
    gap: 0.5rem;
    min-height: 1.8rem;
  }
  .sys-footer-area {
    flex: 2;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .sys-logo-img {
    height: 36px;
    width: auto;
    max-width: 100%;
    display: block;
    mix-blend-mode: multiply;
    opacity: 0.55;
    filter: grayscale(1);
  }
  .sys-badge {
    font-family: "Cormorant SC", serif;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0.8;
    line-height: 1;
  }
  /* VTT DOWNLOAD */
  .vtt-area {
    position: relative;
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .vtt-btn {
    font-family: "Cormorant SC", serif;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0.18rem 0.4rem;
    border: 1px solid var(--rule);
    border-radius: 1px;
    text-decoration: none;
    display: inline-block;
    transition: color 0.12s, border-color 0.12s;
    cursor: pointer;
    background: none;
    line-height: 1.4;
    white-space: nowrap;
  }
  .vtt-btn:hover, .vtt-btn.active {
    border-color: var(--accent-deep);
    color: var(--accent-deep);
  }
  .vtt-dropdown {
    position: absolute;
    bottom: calc(100% + 5px);
    right: -1px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-top: 2px solid var(--accent-deep);
    box-shadow: 0 -4px 18px rgba(31,29,26,0.14);
    min-width: 200px;
    z-index: 200;
    display: none;
  }
  .vtt-dropdown.open { display: block; }
  .vtt-dl-item {
    display: block;
    padding: 0.42rem 0.8rem;
    font-family: "EB Garamond", serif;
    font-size: 0.9rem;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-soft);
    white-space: nowrap;
  }
  .vtt-dl-item:last-child { border-bottom: none; }
  .vtt-dl-item:hover { background: var(--paper-dark); color: var(--ink); }

  .result-count {
    text-align: center;
    font-family: "Cormorant SC", serif;
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 1.5rem;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.75rem;
  }
  .group-head {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin: 1.25rem 0 -0.5rem;
  }
  .group-head:first-child { margin-top: 0; }
  .group-title {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--ink);
    white-space: nowrap;
  }
  .group-rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--rule), transparent);
  }
  .group-meta {
    font-family: "Cormorant SC", serif;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(31, 29, 26, 0.05);
    cursor: pointer;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      var(--accent-deep) 0%,
      var(--gold) 50%,
      var(--accent-deep) 100%);
    opacity: 0.85;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(31, 29, 26, 0.15);
    border-color: var(--gold);
  }
  .card-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: var(--paper-dark);
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: sepia(0.05) saturate(0.95);
  }
  .card-image.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(135deg, var(--paper-dark) 0%, var(--paper) 100%);
    color: var(--ink-faint);
  }
  .card-image .monogram {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: 4.5rem;
    letter-spacing: 0.05em;
    color: var(--gold-deep);
    opacity: 0.55;
    line-height: 1;
  }
  .status-chip {
    position: absolute;
    top: 0.55rem;
    right: 0.55rem;
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
    font-family: "Cormorant SC", serif;
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: rgba(244, 239, 229, 0.92);
    border: 1px solid var(--rule);
    border-radius: 1px;
    padding: 0.16rem 0.45rem;
    line-height: 1.3;
  }
  .status-chip::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--chip, var(--ink-faint));
  }
  .card-body {
    padding: 1rem 1.1rem 0.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-eyebrow {
    font-family: "Cormorant SC", serif;
    font-size: 0.62rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.4rem;
  }
  .card-name {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 1.45rem;
    line-height: 1.15;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }
  .card-name .given {
    font-style: italic;
    color: var(--accent-deep);
  }
  .card-subtitle {
    font-style: italic;
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0 0 0.85rem;
    line-height: 1.35;
  }
  .card-meta {
    margin-top: auto;
    padding-top: 0.7rem;
    border-top: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .meta-row {
    display: flex;
    font-size: 0.85rem;
    line-height: 1.3;
  }
  .meta-row .meta-label {
    font-family: "Cormorant SC", serif;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    width: 72px;
    flex-shrink: 0;
    padding-top: 0.18rem;
  }
  .meta-row .meta-value {
    color: var(--ink-soft);
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-faint);
    font-style: italic;
    font-size: 1.1rem;
    grid-column: 1 / -1;
  }

  footer.colophon {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-family: "Cormorant SC", serif;
    font-size: 0.68rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  @media (max-width: 640px) {
    body { padding: 1.5rem 0.75rem 3rem; }
    h1.masthead-title { font-size: 2.25rem; }
    .filters { grid-template-columns: 1fr; padding: 1rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
    .card-name { font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <div class="page">

    <header class="masthead">
      <div class="eyebrow">Player Character Dossiers</div>
      <h1 class="masthead-title">The Register</h1>
      <p class="masthead-sub">A standing list of player-characters across systems and campaigns.</p>
    </header>

    <div class="filters">
      <div class="filter">
        <label for="filter-q">Search the Register</label>
        <div class="filter-input-wrap">
          <input type="text" id="filter-q" autocomplete="off"
                 placeholder="Name, campaign, system, setting&hellip; ( / )" spellcheck="false">
          <button type="button" class="clear-btn" aria-label="Clear search">&times;</button>
          <div class="suggestions" id="suggestions-q" role="listbox"></div>
        </div>
      </div>
      <div class="sort-wrap">
        <label for="sort-select">Order</label>
        <select id="sort-select" aria-label="Sort order">
          <option value="shuffle">Serendipity</option>
          <option value="name">Name</option>
          <option value="campaign">Campaign</option>
          <option value="system">System</option>
          <option value="added">Newest</option>
        </select>
      </div>
    </div>

    <div class="view-toggles">
      <div class="toggle-group">
        <button class="toggle on" id="featured-btn">Featured</button>
        <select id="preset-select" class="preset-select" aria-label="Preset view">
          <option value="">&#8212;</option>
          <option value="now-playing">Now Playing</option>
          <option value="bushi-oni">The Bushi Oni</option>
          <option value="collateral">Collateral</option>
          <option value="crescent-city">Historica Arcanum: Istanbul</option>
          <option value="fallow-season">The Fallow Season (D&amp;D 5e)</option>
          <option value="silk-road">Historica Arcanum: Silk Road</option>
          <option value="wpgrpgcon-2026">WPGRPGCON 2026</option>
          <option value="retired">Retired</option>
        </select>
      </div>
      <div class="toggle-group" id="status-toggles">
        <span class="toggle-group-label">Status</span>
        <button class="toggle on" data-status="active">Active</button>
        <button class="toggle" data-status="hiatus">Hiatus</button>
        <button class="toggle" data-status="past">Past</button>
        <button class="toggle" data-status="one-shot">One-shot</button>
        <button class="toggle" data-status="unplayed">Unplayed</button>
      </div>
      <div class="toggle-group" id="role-toggles">
        <span class="toggle-group-label">Role</span>
        <button class="toggle on" data-role="pc">PCs</button>
        <button class="toggle" data-role="support">Support</button>
        <button class="toggle" data-role="gm-pc">GM PCs</button>
        <button class="toggle" data-role="pre-gen">Pre-gen</button>
      </div>
      <div class="toggle-group">
        <span class="toggle-group-label">View</span>
        <button class="toggle on" data-view="grid">Grid</button>
        <button class="toggle" data-view="campaign">By campaign</button>
      </div>
    </div>

    <div class="result-count" id="result-count"></div>

    <main class="grid" id="grid"></main>

    <footer class="colophon">Confidential &middot; for the table</footer>
  </div>

<script src="data/roster.js"></script>
<script>
  // ----- Utilities -----
  const entityBox = document.createElement('textarea');
  function decodeEntities(s) { entityBox.innerHTML = s; return entityBox.value; }
  // fold: entity-decode, strip diacritics, lowercase — so "Bialowiezy" finds "Białowieży"
  function fold(s) {
    return decodeEntities(s || '')
      .normalize('NFD').replace(/\p{Diacritic}/gu, '')
      .replace(/ł/g, 'l').replace(/Ł/g, 'L')
      .toLowerCase();
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const roster = shuffle(characters);
  characters.forEach(c => { c._hay = fold([c.plain, c.campaign, c.system, c.setting, c.eyebrow, c.subtitle].filter(Boolean).join(' | ')); });

  const STATUS_LABELS = { active: 'Active', hiatus: 'Hiatus', past: 'Past', 'one-shot': 'One-shot', unplayed: 'Unplayed' };
  const SORTS = {
    name:     (a, b) => fold(a.plain).localeCompare(fold(b.plain)),
    campaign: (a, b) => fold(a.campaign).localeCompare(fold(b.campaign)) || fold(a.plain).localeCompare(fold(b.plain)),
    system:   (a, b) => fold(a.system).localeCompare(fold(b.system)) || fold(a.plain).localeCompare(fold(b.plain)),
    added:    (a, b) => (b.added || '').localeCompare(a.added || '') || fold(a.plain).localeCompare(fold(b.plain)),
  };

  // ----- Filter state -----
  let featuredMode   = true;
  let activeStatuses = new Set(['active']);
  let activeRoles    = new Set(['pc']);
  let sortMode       = 'shuffle';
  let viewMode       = 'grid';

  // ----- Elements -----
  const gridEl  = document.getElementById('grid');
  const countEl = document.getElementById('result-count');
  const qInput  = document.getElementById('filter-q');
  const qSugg   = document.getElementById('suggestions-q');
  const sortSel = document.getElementById('sort-select');

  // ----- Static counts on toggles -----
  for (const btn of document.querySelectorAll('.toggle[data-status]')) {
    const n = characters.filter(c => c.campaignStatus === btn.dataset.status).length;
    btn.innerHTML += ` <span class="count">${n}</span>`;
  }
  for (const btn of document.querySelectorAll('.toggle[data-role]')) {
    const n = characters.filter(c => c.role === btn.dataset.role).length;
    btn.innerHTML += ` <span class="count">${n}</span>`;
  }

  // ----- Cards -----
  function cardHTML(c) {
    const chip = `<span class="status-chip" style="--chip: var(--st-${c.campaignStatus})">${STATUS_LABELS[c.campaignStatus] || c.campaignStatus}</span>`;
    const img = c.image
      ? `<div class="card-image"><img src="${encodeURI(c.image)}" alt="Portrait of ${c.plain}" loading="lazy">${chip}</div>`
      : `<div class="card-image placeholder"><span class="monogram">${c.monogram || c.plain.charAt(0)}</span>${chip}</div>`;
    // System logo/badge (bottom-left)
    const sysEntry = SYSTEM_LOGOS[c.system];
    const sysAbbr = sysEntry ? (sysEntry.abbr || sysEntry) : '';
    const sysSrc  = sysEntry && sysEntry.src ? sysEntry.src : null;
    const sysTitle = c.system.replace(/&amp;/g, '&');
    let sysHtml;
    if (sysSrc) {
      sysHtml = `<div class="sys-footer-area"><img class="sys-logo-img" src="${encodeURI(sysSrc)}" alt="${sysTitle}" title="${sysTitle}"></div>`;
    } else if (sysAbbr) {
      sysHtml = `<div class="sys-footer-area"><span class="sys-badge" title="${sysTitle}">${sysAbbr}</span></div>`;
    } else {
      sysHtml = `<div class="sys-footer-area"></div>`;
    }
    // VTT download (bottom-right)
    let vttHtml = '';
    if (c.sheets && c.sheets.length === 1) {
      const s = c.sheets[0];
      const lbl = VTT_LABELS[s.vtt] || s.vtt.toUpperCase();
      vttHtml = `<div class="vtt-area"><a class="vtt-btn" href="${encodeURI(s.file)}" download title="Download ${lbl} character sheet">${lbl}</a></div>`;
    } else if (c.sheets && c.sheets.length > 1) {
      const lbl = VTT_LABELS[c.sheets[0].vtt] || c.sheets[0].vtt.toUpperCase();
      const items = c.sheets.map(s =>
        `<a class="vtt-dl-item" href="${encodeURI(s.file)}" download>${s.label}</a>`
      ).join('');
      vttHtml = `<div class="vtt-area"><button class="vtt-btn" type="button" title="Download ${lbl} character sheet">${lbl} &#9662;</button><div class="vtt-dropdown">${items}</div></div>`;
    }
    const settingRow = c.setting
      ? `<div class="meta-row"><span class="meta-label">Setting</span><span class="meta-value">${c.setting}</span></div>`
      : '';
    return `
      <div class="card" data-href="${encodeURI(c.file)}" tabindex="0" role="link" aria-label="${c.plain}">
        ${img}
        <div class="card-body">
          <div class="card-eyebrow">${c.eyebrow}</div>
          <h2 class="card-name">${c.name}</h2>
          <p class="card-subtitle">${c.subtitle}</p>
          <div class="card-meta">
            <div class="meta-row"><span class="meta-label">Campaign</span><span class="meta-value">${c.campaign}</span></div>
            ${settingRow}
          </div>
        </div>
        <div class="card-footer">${sysHtml}${vttHtml}</div>
      </div>`;
  }

  // ----- Filtering + sorting -----
  function filteredList() {
    if (featuredMode) return roster.filter(c => c.featured);
    const q = fold(qInput.value.trim());
    return roster.filter(c =>
      activeStatuses.has(c.campaignStatus) &&
      activeRoles.has(c.role) &&
      (!q || c._hay.includes(q))
    );
  }

  function sortedList(list) {
    if (sortMode === 'shuffle') return list; // roster is pre-shuffled
    return list.slice().sort(SORTS[sortMode]);
  }

  function render() {
    let list = sortedList(filteredList());
    if (list.length === 0) {
      gridEl.innerHTML = `<div class="empty-state">No dossiers match the current filters.</div>`;
    } else if (viewMode === 'campaign') {
      const groups = new Map();
      for (const c of list) {
        if (!groups.has(c.campaign)) groups.set(c.campaign, []);
        groups.get(c.campaign).push(c);
      }
      const keys = [...groups.keys()].sort((a, b) => fold(a).localeCompare(fold(b)));
      let html = '';
      for (const k of keys) {
        const members = groups.get(k);
        if (sortMode === 'shuffle') members.sort(SORTS.name);
        const systems = [...new Set(members.map(c => c.system))].join(' / ');
        html += `
          <div class="group-head">
            <span class="group-title">${k}</span>
            <span class="group-rule"></span>
            <span class="group-meta">${members.length} &middot; ${systems}</span>
          </div>`;
        html += members.map(cardHTML).join('');
      }
      gridEl.innerHTML = html;
    } else {
      gridEl.innerHTML = list.map(cardHTML).join('');
    }
    countEl.textContent = featuredMode
      ? `${list.length} featured`
      : list.length === roster.length
        ? `${roster.length} ${roster.length === 1 ? 'dossier' : 'dossiers'} on file`
        : `${list.length} of ${roster.length} shown`;
    syncURL();
  }

  // ----- URL state -----
  // Featured (default) = clean URL. Anything else lives in the querystring,
  // so any filtered view can be bookmarked or shared. #hash = preset alias.
  let currentPreset = '';
  function syncURL() {
    if (currentPreset) { history.replaceState(null, '', location.pathname + '#' + currentPreset); return; }
    if (featuredMode) { history.replaceState(null, '', location.pathname); return; }
    const p = new URLSearchParams();
    p.set('status', [...activeStatuses].join(','));
    p.set('role', [...activeRoles].join(','));
    if (qInput.value.trim()) p.set('q', qInput.value.trim());
    if (sortMode !== 'shuffle') p.set('sort', sortMode);
    if (viewMode !== 'grid') p.set('view', viewMode);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }

  function initFromURL() {
    const key = location.hash.slice(1);
    if (key && PRESETS[key]) {
      document.getElementById('preset-select').value = key;
      applyPreset(key);
      return;
    }
    const p = new URLSearchParams(location.search);
    if ([...p.keys()].length === 0) { render(); return; }
    featuredMode = false;
    document.getElementById('featured-btn').classList.remove('on');
    if (p.get('status')) activeStatuses = new Set(p.get('status').split(',').filter(s => STATUS_LABELS[s]));
    if (p.get('role')) activeRoles = new Set(p.get('role').split(','));
    if (p.get('q')) { qInput.value = p.get('q'); qInput.parentElement.querySelector('.clear-btn').classList.add('visible'); }
    if (p.get('sort') && (p.get('sort') === 'shuffle' || SORTS[p.get('sort')])) { sortMode = p.get('sort'); sortSel.value = sortMode; }
    if (p.get('view') === 'campaign') viewMode = 'campaign';
    refreshToggleClasses();
    render();
  }

  function refreshToggleClasses() {
    document.querySelectorAll('.toggle[data-status]').forEach(btn =>
      btn.classList.toggle('on', activeStatuses.has(btn.dataset.status)));
    document.querySelectorAll('.toggle[data-role]').forEach(btn =>
      btn.classList.toggle('on', activeRoles.has(btn.dataset.role)));
    document.querySelectorAll('.toggle[data-view]').forEach(btn =>
      btn.classList.toggle('on', viewMode === btn.dataset.view));
  }

  // ----- Featured / presets -----
  function exitFeatured() {
    if (featuredMode) {
      featuredMode = false;
      document.getElementById('featured-btn').classList.remove('on');
    }
  }

  function clearPreset() {
    currentPreset = '';
    const sel = document.getElementById('preset-select');
    if (sel && sel.value) {
      sel.value = '';
      sel.classList.remove('active');
    }
  }

  function applyPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    featuredMode = false;
    document.getElementById('featured-btn').classList.remove('on');
    activeStatuses = new Set(p.statuses);
    activeRoles    = new Set(p.roles);
    qInput.value   = p.campaign || p.system || '';
    qInput.parentElement.querySelector('.clear-btn').classList.toggle('visible', qInput.value.length > 0);
    refreshToggleClasses();
    document.getElementById('preset-select').classList.add('active');
    currentPreset = key;
    render();
  }

  document.getElementById('featured-btn').addEventListener('click', () => {
    featuredMode = true;
    document.getElementById('featured-btn').classList.add('on');
    clearPreset();
    render();
  });

  document.getElementById('preset-select').addEventListener('change', (e) => {
    const key = e.target.value;
    if (!key) { e.target.classList.remove('active'); currentPreset = ''; render(); return; }
    applyPreset(key);
  });

  // ----- Toggle handlers -----
  document.querySelectorAll('.toggle[data-status]').forEach(btn => {
    btn.addEventListener('click', () => {
      exitFeatured();
      clearPreset();
      const s = btn.dataset.status;
      if (activeStatuses.has(s)) { activeStatuses.delete(s); btn.classList.remove('on'); }
      else                        { activeStatuses.add(s);    btn.classList.add('on');    }
      render();
    });
  });

  document.querySelectorAll('.toggle[data-role]').forEach(btn => {
    btn.addEventListener('click', () => {
      exitFeatured();
      clearPreset();
      const r = btn.dataset.role;
      if (activeRoles.has(r)) { activeRoles.delete(r); btn.classList.remove('on'); }
      else                     { activeRoles.add(r);    btn.classList.add('on');    }
      render();
    });
  });

  document.querySelectorAll('.toggle[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode = btn.dataset.view;
      refreshToggleClasses();
      render();
    });
  });

  sortSel.addEventListener('change', () => {
    sortMode = sortSel.value;
    render();
  });

  // ----- Card navigation + VTT download -----
  function closeAllVttDropdowns() {
    document.querySelectorAll('.vtt-dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.vtt-btn.active').forEach(b => b.classList.remove('active'));
  }

  gridEl.addEventListener('click', e => {
    const vttBtn = e.target.closest('.vtt-btn[type="button"]');
    if (vttBtn) {
      e.stopPropagation();
      const dropdown = vttBtn.parentElement.querySelector('.vtt-dropdown');
      const isOpen = dropdown.classList.contains('open');
      closeAllVttDropdowns();
      if (!isOpen) { dropdown.classList.add('open'); vttBtn.classList.add('active'); }
      return;
    }
    if (e.target.closest('.vtt-dl-item')) {
      e.stopPropagation();
      closeAllVttDropdowns();
      return;
    }
    if (e.target.closest('.vtt-area')) return;
    const card = e.target.closest('.card[data-href]');
    if (card) window.location.href = card.dataset.href;
  });

  gridEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.card[data-href]');
    if (!card) return;
    e.preventDefault();
    window.location.href = card.dataset.href;
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.vtt-area')) closeAllVttDropdowns();
  });

  // ----- Omnisearch autocomplete -----
  // Suggestion pools: characters by name, campaigns, systems, settings.
  const SUGG_SECTIONS = [
    { label: 'Campaigns',  items: [...new Set(characters.map(c => c.campaign))] },
    { label: 'Systems',    items: [...new Set(characters.map(c => c.system))] },
    { label: 'Settings',   items: [...new Set(characters.map(c => c.setting).filter(Boolean))] },
    { label: 'Characters', items: [...new Set(characters.map(c => c.plain))] },
  ].map(sec => ({
    label: sec.label,
    // display: entity-decoded, so highlight slicing lines up with fold() indexes
    items: sec.items
      .map(v => ({ display: decodeEntities(v), folded: fold(v) }))
      .sort((a, b) => a.folded.localeCompare(b.folded)),
  }));

  function highlight(display, q) {
    if (!q) return display;
    const i = fold(display).indexOf(q);
    if (i === -1) return display;
    // diacritic-stripping is length-preserving on our precomposed data, so folded indexes map 1:1
    return display.slice(0, i) +
      `<span class="match">${display.slice(i, i + q.length)}</span>` +
      display.slice(i + q.length);
  }

  let suggActiveIdx = -1;
  const qClearBtn = qInput.parentElement.querySelector('.clear-btn');

  function refreshSuggestions() {
    const q = fold(qInput.value.trim());
    let html = '';
    let shown = 0;
    for (const sec of SUGG_SECTIONS) {
      // On an empty query, offer campaigns and systems to browse — 147 names is not a menu.
      if (!q && (sec.label === 'Characters' || sec.label === 'Settings')) continue;
      const matches = q ? sec.items.filter(it => it.folded.includes(q)) : sec.items;
      if (!matches.length) continue;
      html += `<div class="sugg-group">${sec.label}</div>`;
      for (const it of matches.slice(0, 8)) {
        html += `<div class="suggestion" role="option" data-value="${it.display.replace(/"/g, '&quot;')}">${highlight(it.display, q)}</div>`;
        shown++;
      }
    }
    suggActiveIdx = -1;
    qSugg.innerHTML = html || `<div class="suggestion empty">No matches</div>`;
  }

  function openSugg() { refreshSuggestions(); qSugg.classList.add('open'); }
  function closeSugg() { qSugg.classList.remove('open'); suggActiveIdx = -1; }

  qInput.addEventListener('focus', openSugg);
  qInput.addEventListener('input', () => {
    exitFeatured();
    clearPreset();
    qClearBtn.classList.toggle('visible', qInput.value.length > 0);
    refreshSuggestions();
    qSugg.classList.add('open');
    render();
  });

  qInput.addEventListener('keydown', (e) => {
    const items = [...qSugg.querySelectorAll('.suggestion:not(.empty)')];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!qSugg.classList.contains('open')) openSugg();
      if (items.length === 0) return;
      suggActiveIdx = (suggActiveIdx + 1) % items.length;
      updateActiveSugg(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length === 0) return;
      suggActiveIdx = suggActiveIdx <= 0 ? items.length - 1 : suggActiveIdx - 1;
      updateActiveSugg(items);
    } else if (e.key === 'Enter') {
      if (suggActiveIdx >= 0 && items[suggActiveIdx]) {
        e.preventDefault();
        selectSuggestion(items[suggActiveIdx].dataset.value);
      } else {
        closeSugg();
      }
    } else if (e.key === 'Escape') {
      closeSugg();
      qInput.blur();
    }
  });

  function updateActiveSugg(items) {
    items.forEach((el, i) => el.classList.toggle('active', i === suggActiveIdx));
    if (items[suggActiveIdx]) items[suggActiveIdx].scrollIntoView({ block: 'nearest' });
  }

  qSugg.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.suggestion');
    if (!item || item.classList.contains('empty')) return;
    e.preventDefault();
    selectSuggestion(item.dataset.value);
  });

  function selectSuggestion(v) {
    exitFeatured();
    clearPreset();
    qInput.value = v;
    qClearBtn.classList.add('visible');
    closeSugg();
    render();
  }

  qClearBtn.addEventListener('click', () => {
    qInput.value = '';
    qClearBtn.classList.remove('visible');
    closeSugg();
    render();
    qInput.focus();
  });

  document.addEventListener('click', (e) => {
    if (!qInput.parentElement.contains(e.target)) closeSugg();
  });

  // "/" focuses search from anywhere
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      qInput.focus();
      qInput.select();
    }
  });

  // ----- Boot -----
  initFromURL();
</script>
</body>
</html>
